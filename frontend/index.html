<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlight | Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <section class="brand-panel" aria-label="Moonlight store introduction">
                <span>Moonlight</span>
                <p class="eyebrow">A little luxury, every day</p>
                <h1>Find pieces that feel like <em>you.</em></h1>
                <p>Curated essentials for slow mornings, late nights, and every beautiful moment in between.</p>
            </div>
            <p class="brand-footer">Thoughtfully selected. Made to last.</p>
        </section>
            <div class="form-wrap">
                <div class="form-heading">
                    <p class="eyebrow">Welcome back</p>
                    <h2 id="form-title">Log in to Moonlight</h2>
                    <p id="form-description">Your favorites are waitiing for you</p>
                </div>
                <form id="auth-form">
                        <label for="name">Full name</label>
                        <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name">
                    </div>
                    <div class="field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a class="forgot-link" href="#">Forgot password?</a>
                        </div>
                        <div class="password-input">
                            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                            <button class="password-toggle" type="button" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <label class="remember-row login-only">
                        <input type="checkbox" name="remember">
                        <span>Keep me logged in</span>
                    </label>
                </form>
        </section>
    </main>
<main>
    </scripts>
</main>
